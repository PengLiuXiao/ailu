name: Release Obsidian plugin

on:
  push:
    tags:
      - '*.*.*'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency tree
        run: npm run audit:dependencies

      - name: Test, lint, and build
        run: npm run check

      - name: Verify tag and manifest version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node --input-type=module -e
          "import manifest from './manifest.json' with { type: 'json' };
          if (manifest.version !== process.env.RELEASE_TAG)
          throw new Error('Tag must match manifest version');"

      - name: Verify release assets
        run: >-
          test -s main.js &&
          test -s manifest.json &&
          test -s styles.css &&
          test -s build-attestation.json &&
          test -s LICENSE &&
          test -s THIRD_PARTY_NOTICES.md &&
          test "$(find LICENSES -maxdepth 1 -type f -name '*.txt' | wc -l)" -eq 9

      - name: Stage verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ailu-release-assets
          if-no-files-found: error
          retention-days: 1
          path: |
            main.js
            manifest.json
            styles.css
            build-attestation.json
            LICENSE
            THIRD_PARTY_NOTICES.md
            LICENSES/*.txt

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ailu-release-assets

      - name: Generate artifact attestation
        # Public releases receive GitHub-hosted provenance. Keep private forks usable.
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            build-attestation.json
            LICENSE
            THIRD_PARTY_NOTICES.md
            LICENSES/*.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            main.js manifest.json styles.css build-attestation.json \
            LICENSE THIRD_PARTY_NOTICES.md LICENSES/*.txt
